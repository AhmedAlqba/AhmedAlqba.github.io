<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAC Codes - مجتمع أكواد لعبة LAC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --primary-blue: #2563eb;
            --accent-orange: #f97316;
            --text-white: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            direction: rtl;
        }

        .text-orange { color: var(--accent-orange); }
        .text-blue { color: var(--primary-blue); }
        .hidden { display: none !important; }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: var(--card-dark);
            border-bottom: 2px solid var(--primary-blue);
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-btn, .btn {
            background: transparent;
            border: none;
            color: var(--text-white);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: var(--primary-blue);
        }

        .btn-orange {
            background-color: var(--accent-orange);
            color: #fff;
        }

        .btn-orange:hover {
            background-color: #ea580c;
        }

        .btn-full { width: 100%; }

        /* Container */
        .container {
            padding: 20px 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Filters */
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-btn {
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-btn.active {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        /* Codes Grid */
        .codes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .code-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .code-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
        }

        /* Form Styles */
        .form-card {
            background-color: var(--card-dark);
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
        }

        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .input-group input, .input-group textarea {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--primary-blue);
        }

        /* Profile Elements */
        .profile-card {
            background-color: var(--card-dark);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .avatar-img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 2px solid var(--accent-orange);
            background-color: var(--bg-dark);
        }

        .avatar-selector-box {
            margin: 15px 0;
            padding: 15px;
            background: var(--bg-dark);
            border-radius: 8px;
        }

        .avatars-preset {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .avatar-option {
            width: 45px;
            height: 45px;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .avatar-option:hover { border-color: var(--accent-orange); }

        .profile-tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0 15px 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .p-tab {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            cursor: pointer;
        }

        .p-tab.active { color: var(--accent-orange); }

        /* Toast Notification */
        .toast {
            visibility: hidden;
            min-width: 200px;
            background-color: var(--accent-orange);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 12px;
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }

        .toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <span class="text-orange">LAC</span> <span class="text-blue">CODES</span>
        </div>
        <nav class="nav-links">
            <button class="nav-btn active" onclick="switchTab('home')"><i class="fa-solid fa-house"></i> الرئيسية</button>
            <button class="nav-btn" onclick="switchTab('add-code')"><i class="fa-solid fa-plus-circle"></i> نشر كود</button>
            <button class="nav-btn" onclick="switchTab('profile')"><i class="fa-solid fa-user"></i> البروفايل</button>
        </nav>
        <div class="auth-buttons" id="auth-actions">
            <button class="btn btn-orange" onclick="loginWithGoogle()"><i class="fa-solid fa-right-to-bracket"></i> تسجيل Google</button>
        </div>
    </header>

    <main class="container">
        <!-- 1. الرئيسية -->
        <section id="sec-home" class="tab-content active">
            <div class="filter-tabs">
                <button class="filter-btn active"><i class="fa-solid fa-shuffle"></i> لك / عشوائي</button>
                <button class="filter-btn"><i class="fa-solid fa-fire"></i> الأكثر تحميلاً</button>
                <button class="filter-btn"><i class="fa-solid fa-star"></i> مميز</button>
            </div>

            <div class="codes-grid" id="codes-container">
                <p class="loading-text">جاري تحميل الأكواد...</p>
            </div>
        </section>

        <!-- 2. نشر كود -->
        <section id="sec-add-code" class="tab-content">
            <div class="form-card">
                <h2><i class="fa-solid fa-code"></i> نشر كود جديد</h2>
                <form id="add-code-form">
                    <div class="input-group">
                        <label>عنوان الكود</label>
                        <input type="text" id="code-title" placeholder="مثال: سيارة رياضية سريعة" required>
                    </div>
                    <div class="input-group">
                        <label>الكود النصي</label>
                        <textarea id="code-content" rows="3" placeholder="ضع الكود هنا..." required></textarea>
                    </div>
                    <div class="input-group">
                        <label>رابط صورة المعاينة (ضع رابط صورة خارجي)</label>
                        <input type="url" id="code-image" placeholder="https://i.imgur.com/example.jpg">
                    </div>
                    <button type="submit" class="btn btn-orange btn-full"><i class="fa-solid fa-paper-plane"></i> نشر الكود للمراجعة</button>
                </form>
            </div>
        </section>

        <!-- 3. البروفايل -->
        <section id="sec-profile" class="tab-content">
            <div class="profile-card">
                <div class="profile-header">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=1" id="user-avatar" class="avatar-img" alt="Avatar">
                    <div class="profile-info">
                        <h3 id="user-name">زائر غير مسجل</h3>
                        <p id="user-bio" class="bio-text">قم بتسجيل الدخول لنشر الأكواد وحفظ المفضلة.</p>
                    </div>
                </div>

                <div class="avatar-selector-box">
                    <h4>اختر صورة رمزية لحسابك:</h4>
                    <div class="avatars-preset">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=1" onclick="selectAvatar(this.src)" class="avatar-option">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=2" onclick="selectAvatar(this.src)" class="avatar-option">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=3" onclick="selectAvatar(this.src)" class="avatar-option">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=4" onclick="selectAvatar(this.src)" class="avatar-option">
                    </div>
                </div>

                <div class="profile-tabs">
                    <button class="p-tab active">أكوادي المنشورة</button>
                    <button class="p-tab">المحفوظات</button>
                </div>
                <div id="profile-codes-list" class="codes-grid"></div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast">تم النسخ بنجاح!</div>

    <!-- كود الجافاسكريبت والربط المباشر بـ Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWfuEsft1QI2Rd0zT3w7spLKJJVODHteY",
            authDomain: "lac-code-in-web.firebaseapp.com",
            projectId: "lac-code-in-web",
            storageBucket: "lac-code-in-web.firebasestorage.app",
            messagingSenderId: "95337911606",
            appId: "1:95337911606:web:508d6c1529cc6af61acf97"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // التنقل بين الأقسام
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

            const activeSec = document.getElementById(`sec-${tabId}`);
            if(activeSec) activeSec.classList.add('active');
            
            // تحديث الزر النشط
            event.currentTarget.classList.add('active');
        };

        // اختيار صورة البروفايل
        window.selectAvatar = function(url) {
            document.getElementById('user-avatar').src = url;
        };

        // تسجيل الدخول بجوجل
        window.loginWithGoogle = function() {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider).then((result) => {
                const user = result.user;
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-avatar').src = user.photoURL;
                alert("تم تسجيل الدخول بنجاح: " + user.displayName);
            }).catch((error) => {
                console.error(error);
            });
        };
    </script>
</body>
</html>
