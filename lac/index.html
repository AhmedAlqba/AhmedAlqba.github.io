<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAC Codes - مكتبة الأكواد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --blue: #2563eb; --orange: #f97316; --text: #f8fafc; --muted: #94a3b8; --border: #334155; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); direction: rtl; }
        
        .navbar { display:flex; justify-size: space-between; align-items:center; padding:1rem; background:var(--card); border-bottom:2px solid var(--blue); }
        .logo { font-size:1.3rem; font-weight:bold; }
        .text-orange { color: var(--orange); } .text-blue { color: var(--blue); }
        
        .container { padding: 15px; max-width:700px; margin:0 auto; }
        .btn { background:var(--card); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:bold; }
        .btn-orange { background:var(--orange); border:none; }
        .btn-blue { background:var(--blue); border:none; }
        .btn-danger { background:#ef4444; border:none; }
        .btn-full { width:100%; margin-top:10px; }

        .card { background:var(--card); padding:15px; border-radius:10px; border:1px solid var(--border); margin-bottom:20px; }
        .input-group { margin-bottom:12px; }
        .input-group label { display:block; margin-bottom:5px; color:var(--muted); font-size:0.85rem; }
        .input-group input, .input-group textarea { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px; border-radius:6px; outline:none; }

        .code-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:15px; margin-bottom:15px; }
        .code-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
        .author { font-size:0.85rem; color:var(--orange); font-weight:bold; }
        .code-img { width:100%; height:160px; object-fit:cover; border-radius:6px; margin-bottom:10px; }
        .code-box { background:var(--bg); padding:10px; border-radius:6px; font-family:monospace; font-size:0.85rem; word-break:break-all; margin:10px 0; }
        
        .actions-row { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
        .comments-section { background:var(--bg); padding:10px; border-radius:6px; margin-top:10px; display:none; }
        .comment-item { border-bottom:1px solid var(--border); padding:5px 0; font-size:0.85rem; }
        .comment-author { color:var(--blue); font-weight:bold; }

        .toast { visibility:hidden; background:var(--orange); color:#fff; text-align:center; border-radius:6px; padding:8px 15px; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); }
        .toast.show { visibility:visible; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo"><span class="text-orange">LAC</span> <span class="text-blue">CODES</span></div>
        <div>
            <button class="btn btn-orange" onclick="togglePublish()"><i class="fa-solid fa-plus"></i> نشر كود</button>
        </div>
    </header>

    <main class="container">
        
        <!-- نموذج نشر كود جديد -->
        <div class="card" id="publish-box" style="display:none;">
            <h2>نشر كود جديد</h2>
            <br>
            <form id="add-code-form">
                <div class="input-group">
                    <label>اسم الناشر</label>
                    <input type="text" id="publisher-name" placeholder="ضع اسمك أو لقبك" required>
                </div>
                <div class="input-group">
                    <label>عنوان الكود</label>
                    <input type="text" id="code-title" placeholder="مثال: سيارة رياضية" required>
                </div>
                <div class="input-group">
                    <label>وصف الكود</label>
                    <textarea id="code-desc" rows="2" placeholder="وصف بسيط للمنشور..."></textarea>
                </div>
                <div class="input-group">
                    <label>الكود النصي</label>
                    <textarea id="code-content" rows="3" placeholder="ضع الكود هنا..." required></textarea>
                </div>
                <div class="input-group">
                    <label>رابط صورة المعاينة (اختياري)</label>
                    <input type="url" id="code-image" placeholder="إذا تركته فارغاً ستظهر صورة افتراضية">
                </div>
                <button type="submit" class="btn btn-orange btn-full">نشر الكود فوراً</button>
            </form>
        </div>

        <!-- قائمة الأكواد -->
        <div id="codes-list">
            <p style="text-align:center;">جاري تحميل الأكواد...</p>
        </div>

    </main>

    <div id="toast" class="toast">تم النسخ بنجاح!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, increment, arrayUnion, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWfuEsft1QI2Rd0zT3w7spLKJJVODHteY",
            authDomain: "lac-code-in-web.firebaseapp.com",
            projectId: "lac-code-in-web",
            storageBucket: "lac-code-in-web.firebasestorage.app",
            messagingSenderId: "95337911606",
            appId: "1:95337911606:web:508d6c1529cc6af61acf97"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const DEFAULT_IMG = "https://via.placeholder.com/600x300/1e293b/f97316?text=LAC+CODE";

        window.togglePublish = () => {
            const box = document.getElementById('publish-box');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        };

        // نشر الكود
        document.getElementById('add-code-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const publisher = document.getElementById('publisher-name').value;
            const title = document.getElementById('code-title').value;
            const desc = document.getElementById('code-desc').value;
            const content = document.getElementById('code-content').value;
            const image = document.getElementById('code-image').value || DEFAULT_IMG;

            try {
                await addDoc(collection(db, "codes"), {
                    publisher, title, desc, content, image,
                    likes: 0,
                    comments: [],
                    createdAt: serverTimestamp()
                });
                alert("تم نشر الكود بنجاح!");
                document.getElementById('add-code-form').reset();
                togglePublish();
                loadCodes();
            } catch (err) { alert("خطأ في النشر: " + err.message); }
        });

        // قراءة وتحديث الأكواد
        async function loadCodes() {
            const container = document.getElementById('codes-list');
            try {
                const q = query(collection(db, "codes"), orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);
                container.innerHTML = "";

                if(snapshot.empty) { container.innerHTML = "<p style='text-align:center;'>لا توجد أكواد منشورة بعد.</p>"; return; }

                snapshot.forEach(docSnap => {
                    const id = docSnap.id;
                    const data = docSnap.data();
                    const commentsCount = data.comments ? data.comments.length : 0;

                    const cardHTML = `
                        <div class="code-card">
                            <div class="code-header">
                                <h3>${data.title}</h3>
                                <span class="author"><i class="fa-solid fa-user"></i> ${data.publisher}</span>
                            </div>
                            <p style="font-size:0.9rem; color:var(--muted);">${data.desc || ''}</p>
                            <img src="${data.image}" class="code-img" alt="كود">
                            <div class="code-box">${data.content}</div>
                            
                            <div class="actions-row">
                                <button class="btn btn-orange" onclick="copyText('${data.content}')"><i class="fa-solid fa-copy"></i> نسخ</button>
                                <button class="btn" onclick="likePost('${id}')"><i class="fa-solid fa-heart text-orange"></i> <span id="likes-${id}">${data.likes || 0}</span></button>
                                <button class="btn" onclick="toggleComments('${id}')"><i class="fa-solid fa-comment text-blue"></i> ${commentsCount}</button>
                                <button class="btn btn-danger" onclick="reportPost('${id}', '${data.title}')"><i class="fa-solid fa-flag"></i> إبلاغ</button>
                            </div>

                            <div class="comments-section" id="comments-box-${id}">
                                <div id="comments-list-${id}">
                                    ${(data.comments || []).map(c => `<div class="comment-item"><span class="comment-author">${c.author}:</span> ${c.text}</div>`).join('')}
                                </div>
                                <div style="display:flex; gap:5px; margin-top:8px;">
                                    <input type="text" id="c-name-${id}" placeholder="اسمك" style="width:30%;">
                                    <input type="text" id="c-text-${id}" placeholder="اكتب تعليقاً..." style="width:50%;">
                                    <button class="btn btn-blue" style="width:20%;" onclick="addComment('${id}')">إرسال</button>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });
            } catch (err) { container.innerHTML = "<p style='text-align:center;'>خطأ في تحميل البيانات.</p>"; }
        }

        // نسخ الكود
        window.copyText = (text) => {
            navigator.clipboard.writeText(text);
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        };

        // الإعجابات
        window.likePost = async (id) => {
            const postRef = doc(db, "codes", id);
            await updateDoc(postRef, { likes: increment(1) });
            const likeSpan = document.getElementById(`likes-${id}`);
            likeSpan.innerText = parseInt(likeSpan.innerText) + 1;
        };

        // التحكم بفتح التعليقات
        window.toggleComments = (id) => {
            const box = document.getElementById(`comments-box-${id}`);
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        };

        // إضافة تعليق
        window.addComment = async (id) => {
            const author = document.getElementById(`c-name-${id}`).value || 'مجهول';
            const text = document.getElementById(`c-text-${id}`).value;
            if(!text) return;

            const postRef = doc(db, "codes", id);
            await updateDoc(postRef, {
                comments: arrayUnion({ author, text, date: new Date().toISOString() })
            });

            const list = document.getElementById(`comments-list-${id}`);
            list.innerHTML += `<div class="comment-item"><span class="comment-author">${author}:</span> ${text}</div>`;
            document.getElementById(`c-text-${id}`).value = '';
        };

        // الإبلاغ (يصل للأدمن)
        window.reportPost = async (id, title) => {
            const reason = prompt("ما هو سبب الإبلاغ عن هذا الكود؟");
            if(reason) {
                await addDoc(collection(db, "reports"), {
                    codeId: id,
                    codeTitle: title,
                    reason: reason,
                    reportedAt: serverTimestamp()
                });
                alert("تم إرسال بلاغك للإدارة بنجاح، شكراً لمساعدتك!");
            }
        };

        loadCodes();
    </script>
</body>
</html>
