<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAC Codes - مجتمع أكواد لعبة LAC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --primary-blue: #2563eb;
            --accent-orange: #f97316;
            --text-white: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-white); direction: rtl; }

        .text-orange { color: var(--accent-orange); }
        .text-blue { color: var(--primary-blue); }
        .hidden { display: none !important; }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 1.5rem; background-color: var(--card-dark);
            border-bottom: 2px solid var(--primary-blue); flex-wrap: wrap; gap: 10px;
        }

        .logo { font-size: 1.4rem; font-weight: bold; }
        .nav-links { display: flex; gap: 8px; }

        .nav-btn, .btn {
            background: transparent; border: none; color: var(--text-white);
            padding: 8px 14px; border-radius: 6px; cursor: pointer;
            font-weight: bold; transition: 0.3s; font-size: 0.95rem;
        }

        .nav-btn:hover, .nav-btn.active { background-color: var(--primary-blue); }
        .btn-orange { background-color: var(--accent-orange); color: #fff; }
        .btn-orange:hover { background-color: #ea580c; }
        .btn-full { width: 100%; }

        .container { padding: 20px 15px; max-width: 1000px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .filter-tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .filter-btn {
            background: var(--card-dark); border: 1px solid var(--border-color);
            color: var(--text-white); padding: 8px 16px; border-radius: 20px;
            cursor: pointer; white-space: nowrap;
        }
        .filter-btn.active { border-color: var(--accent-orange); color: var(--accent-orange); }

        .codes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .code-card {
            background-color: var(--card-dark); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .code-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }

        .form-card {
            background-color: var(--card-dark); padding: 20px; border-radius: 10px;
            max-width: 600px; margin: 0 auto; border: 1px solid var(--border-color);
        }
        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.9rem; color: var(--text-muted); }
        .input-group input, .input-group textarea {
            background-color: var(--bg-dark); border: 1px solid var(--border-color);
            color: var(--text-white); padding: 10px; border-radius: 6px; outline: none;
        }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--primary-blue); }

        .profile-card { background-color: var(--card-dark); padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); }
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .avatar-img { width: 75px; height: 75px; border-radius: 50%; border: 2px solid var(--accent-orange); background-color: var(--bg-dark); }

        .toast {
            visibility: hidden; min-width: 200px; background-color: var(--accent-orange);
            color: #fff; text-align: center; border-radius: 6px; padding: 12px;
            position: fixed; bottom: 30px; right: 30px; z-index: 1000;
        }
        .toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <span class="text-orange">LAC</span> <span class="text-blue">CODES</span>
        </div>
        <nav class="nav-links">
            <button class="nav-btn active" onclick="switchTab('home')"><i class="fa-solid fa-house"></i> الرئيسية</button>
            <button class="nav-btn" onclick="switchTab('add-code')"><i class="fa-solid fa-plus-circle"></i> نشر كود</button>
            <button class="nav-btn" onclick="switchTab('profile')"><i class="fa-solid fa-user"></i> البروفايل</button>
        </nav>
        <div class="auth-buttons" id="auth-actions">
            <button class="btn btn-orange" id="login-btn"><i class="fa-solid fa-right-to-bracket"></i> تسجيل Google</button>
        </div>
    </header>

    <main class="container">
        <!-- الرئيسية -->
        <section id="sec-home" class="tab-content active">
            <div class="filter-tabs">
                <button class="filter-btn active" onclick="filterCodes('all', this)"><i class="fa-solid fa-shuffle"></i> الكل / عشوائي</button>
                <button class="filter-btn" onclick="filterCodes('popular', this)"><i class="fa-solid fa-fire"></i> الأكثر تحميلاً</button>
                <button class="filter-btn" onclick="filterCodes('featured', this)"><i class="fa-solid fa-star"></i> مميز</button>
            </div>

            <div class="codes-grid" id="codes-container">
                <p class="loading-text">جاري تحميل الأكواد المعتمدة...</p>
            </div>
        </section>

        <!-- نشر كود -->
        <section id="sec-add-code" class="tab-content">
            <div class="form-card">
                <h2><i class="fa-solid fa-code"></i> نشر كود جديد</h2>
                <form id="add-code-form">
                    <div class="input-group">
                        <label>عنوان الكود</label>
                        <input type="text" id="code-title" placeholder="مثال: سيارة رياضية سريعة" required>
                    </div>
                    <div class="input-group">
                        <label>الكود النصي</label>
                        <textarea id="code-content" rows="3" placeholder="ضع الكود هنا..." required></textarea>
                    </div>
                    <div class="input-group">
                        <label>رابط صورة المعاينة (ضع رابط صورة خارجي)</label>
                        <input type="url" id="code-image" placeholder="https://i.imgur.com/example.jpg">
                    </div>
                    <button type="submit" class="btn btn-orange btn-full"><i class="fa-solid fa-paper-plane"></i> إرسال الكود للمراجعة</button>
                </form>
            </div>
        </section>

        <!-- البروفايل -->
        <section id="sec-profile" class="tab-content">
            <div class="profile-card">
                <div class="profile-header">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=1" id="user-avatar" class="avatar-img" alt="Avatar">
                    <div class="profile-info">
                        <h3 id="user-name">زائر غير مسجل</h3>
                        <p id="user-bio" class="bio-text">قم بتسجيل الدخول لنشر الأكواد وحفظ المفضلة.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast">تم نسخ الكود بنجاح!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWfuEsft1QI2Rd0zT3w7spLKJJVODHteY",
            authDomain: "lac-code-in-web.firebaseapp.com",
            projectId: "lac-code-in-web",
            storageBucket: "lac-code-in-web.firebasestorage.app",
            messagingSenderId: "95337911606",
            appId: "1:95337911606:web:508d6c1529cc6af61acf97"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let currentUser = null;

        // التنقل بين الأقسام
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

            const activeSec = document.getElementById(`sec-${tabId}`);
            if(activeSec) activeSec.classList.add('active');
            if(event && event.currentTarget) event.currentTarget.classList.add('active');
        };

        // نسح الكود
        window.copyCode = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById("toast");
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 3000);
            });
        };

        // تسجيل الدخول
        document.getElementById('login-btn').addEventListener('click', () => {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider).then((result) => {
                currentUser = result.user;
                updateUserUI(currentUser);
            }).catch((err) => console.error("Login Error:", err));
        });

        onAuthStateChanged(auth, (user) => {
            if(user) {
                currentUser = user;
                updateUserUI(user);
            }
        });

        function updateUserUI(user) {
            document.getElementById('user-name').innerText = user.displayName;
            document.getElementById('user-avatar').src = user.photoURL || "https://api.dicebear.com/7.x/bottts/svg?seed=1";
            document.getElementById('user-bio').innerText = "أهلاً بك! يمكنك الآن نشر الأكواد ورؤيتها بعد موافقة الأدمن.";
            document.getElementById('auth-actions').innerHTML = `<span class="text-orange"><i class="fa-solid fa-user-check"></i> ${user.displayName.split(' ')[0]}</span>`;
        }

        // إرسال الكود إلى Firebase
        document.getElementById('add-code-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUser) {
                alert("يرجى تسجيل الدخول أولاً لنشر الكود!");
                return;
            }

            const title = document.getElementById('code-title').value;
            const content = document.getElementById('code-content').value;
            const image = document.getElementById('code-image').value || "https://via.placeholder.com/300x150?text=LAC+Code";

            try {
                await addDoc(collection(db, "codes"), {
                    title: title,
                    content: content,
                    image: image,
                    status: "pending", // معلق حتى يوافق الأدمن
                    author: currentUser.displayName,
                    createdAt: new Date()
                });
                alert("تم إرسال الكود بنجاح! سينتظر مراجعة الأدمن ليظهر في الرئيسية.");
                document.getElementById('add-code-form').reset();
                switchTab('home');
            } catch(err) {
                alert("حدث خطأ أثناء إرسال الكود: " + err.message);
            }
        });

        // جلب الأكواد المقبولة
        async function loadApprovedCodes() {
            const container = document.getElementById('codes-container');
            try {
                const q = query(collection(db, "codes"), where("status", "==", "approved"));
                const querySnapshot = await getDocs(q);
                container.innerHTML = "";

                if(querySnapshot.empty) {
                    container.innerHTML = "<p class='text-muted'>لا توجد أكواد معتمدة حالياً.</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    container.innerHTML += `
                        <div class="code-card">
                            <img src="${data.image}" alt="Preview">
                            <h3>${data.title}</h3>
                            <p class="text-muted">الناشر: ${data.author}</p>
                            <button class="btn btn-orange btn-full" onclick="copyCode('${data.content}')"><i class="fa-solid fa-copy"></i> نسخ الكود</button>
                        </div>
                    `;
                });
            } catch(err) {
                container.innerHTML = "<p class='text-muted'>حدث خطأ أثناء تحميل البيانات.</p>";
            }
        }

        window.filterCodes = function(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadApprovedCodes();
        };

        loadApprovedCodes();
    </script>
</body>
</html>
